<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Reef</title>
<style>
  :root { color-scheme: light dark; --bg: #f7fbfd; --ink: #10293a; --muted: #4a6577; --link: #0a6a9e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #071c2b; --ink: #e6f4fb; --muted: #9fc0d2; --link: #7cc9f2; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  p { color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Bubble Reef</h1>
  <p>An underwater bubble-matching puzzle game by PiWare.</p>
  <p><a href="privacy/">Privacy Policy</a></p>
</main>
</body>
</html>
